{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Ruta no encontrada</title>

    <!-- Bootstrap y estilos Jematti OS. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'portafolio/css/styles.css' %}">
</head>
<body>
    <div class="site-noise"></div>
    <div class="grid-background"></div>

    <!-- Pantalla de error con lenguaje de terminal. -->
    <main class="error-page">
        <section class="error-panel">
            <p class="terminal-line">
                <span>jematti@os</span>:~$ route --status=not-found
            </p>

            <h1>404</h1>
            <h2>Ruta no encontrada</h2>
            <p>La direccion solicitada no existe o fue movida dentro de la bitacora tecnica.</p>

            <a href="/" class="btn-os-primary">
                Volver al inicio
                <i class="bi bi-arrow-return-left"></i>
            </a>
        </section>
    </main>
</body>
</html>
